---
clusterName: home-ops
talosVersion: ${TALOS_VERSION}
kubernetesVersion: ${KUBERNETES_VERSION}
endpoint: https://${NODE_IP}:6443
allowSchedulingOnControlPlanes: true

additionalApiServerCertSans:
  - ${NODE_IP}
additionalMachineCertSans:
  - ${NODE_IP}

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

cniConfig:
  name: none

nodes:
  - hostname: talos-1
    ipAddress: ${NODE_IP}
    controlPlane: true
    # sda, 100GB. No `serial` field under Hyper-V's storvsc_host transport, so wwid
    # is the stable identifier instead. Confirmed against the running node with
    # `talosctl get disks --insecure`, not guessed.
    installDiskSelector:
      wwid: naa.60022480303b2e59f14450f1f2403ff6
    # sdb, exactly 200GiB raw. minSize sits below that on purpose: it gates disk
    # selection, and a 200GiB partition does not fit on a 200GiB disk once GPT and
    # alignment are deducted. See ADR 0012.
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.wwid == "naa.60022480b9c47ae75685562943176417"
          minSize: 190GiB
    # Pinned to the ID in talos/schematic-id.txt rather than re-derived from
    # talos/schematic.yaml at generate time, so a schematic change can't silently
    # take effect here before its ID is regenerated and re-committed.
    patches:
      - |-
        machine:
          install:
            image: factory.talos.dev/installer/4a0d65c669d46663f377e7161e50cfd570c401f26fd9e7bda34a0216b6f1922b:${TALOS_VERSION}
    # OAuth client, not a reusable auth key: see docs/bootstrap.md. TS_AUTHKEY comes
    # from talenv.sops.yaml via envsubst, never appears here in plain text.
    extensionServices:
      - name: tailscale
        environment:
          - TS_AUTHKEY=${TS_AUTHKEY}
          - TS_HOSTNAME=talos-1
          - TS_ROUTES=10.244.0.0/16,10.96.0.0/12
          - TS_EXTRA_ARGS=--advertise-tags=tag:k8s --accept-routes

controlPlane:
  patches:
    # Cilium replaces both. See ADR 0002.
    - |-
      cluster:
        proxy:
          disabled: true
    # Otherwise both bind to localhost and Prometheus cannot scrape them.
    # Resource requests are Talos's tiny defaults (10m/50m): fine on an idle
    # node, but live CI load repeatedly starved both into CrashLoopBackOff
    # (leader-election lease renewals timing out against the local
    # apiserver) once actions-runner-system's job pods, sized off their own
    # requests, out-competed them for CFS shares under contention. kube-apiserver
    # was never affected: its own default is already 200m/512Mi. Matching that
    # here gives scheduler and controller-manager a comparable floor instead
    # of effectively none.
    - |-
      cluster:
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
    # The kubelet runs in its own restricted mount namespace, so a UserVolumeConfig
    # mount isn't visible to it, or to hostPath volumes in pods, without this.
    # local-path-provisioner's helper pods failed with "read-only file system" on
    # /var/mnt/data until this was added.
    - |-
      machine:
        kubelet:
          extraMounts:
            - destination: /var/mnt/data
              type: bind
              source: /var/mnt/data
              options:
                - bind
                - rshared
                - rw
    # Grants a standing os:admin credential to tuppr and the cluster-backup
    # machine-config job's ServiceAccount CRDs. See ADR 0010 and ADR 0011.
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - system-upgrade
              - system-backup
