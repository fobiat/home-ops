---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: umami-backup
  namespace: flux-system
spec:
  # Suspended 2026-08-24 to free memory for the applejackrp dev server.
  # Reverse with scripts/cluster-restore-nonvital.sh, or by deleting this
  # line. Suspended rather than removed from the parent kustomization,
  # which would prune the app and its data instead of pausing it.
  suspend: true
  targetNamespace: umami
  dependsOn:
    - name: umami-db
  commonMetadata:
    labels:
      app.kubernetes.io/name: umami-backup
  path: ./kubernetes/apps/umami/umami-backup/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
