---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: umami-backup
  namespace: flux-system
spec:
  targetNamespace: umami
  dependsOn:
    - name: umami-db
  commonMetadata:
    labels:
      app.kubernetes.io/name: umami-backup
  path: ./kubernetes/apps/umami/umami-backup/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
