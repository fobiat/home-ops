---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: umami
  namespace: flux-system
spec:
  targetNamespace: umami
  dependsOn:
    - name: umami-db
    - name: network-gateway
  commonMetadata:
    labels:
      app.kubernetes.io/name: umami
  path: ./kubernetes/apps/umami/umami/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
