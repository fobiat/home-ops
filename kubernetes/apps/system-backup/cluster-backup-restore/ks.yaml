---
# Suspended on purpose. A ReplicationDestination with copyMethod: Direct and a
# destinationPVC pointing at a live PVC fires the moment it is created, because
# status.lastManualSync starts empty. Suspended, the object never exists in the
# cluster, and CI still lints and kubeconforms it. Restoring is a PR that sets
# suspend: false and bumps trigger.manual. See docs/runbooks/restore.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-backup-restore
  namespace: flux-system
spec:
  suspend: true
  targetNamespace: system-backup
  dependsOn:
    - name: cluster-backup
  commonMetadata:
    labels:
      app.kubernetes.io/name: cluster-backup-restore
  path: ./kubernetes/apps/system-backup/cluster-backup-restore/app
  prune: true
  wait: true
  interval: 1h
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
