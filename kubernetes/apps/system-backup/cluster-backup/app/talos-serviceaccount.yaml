---
# Talos mints the machineconfig-backup-talosconfig Secret this CronJob mounts,
# once the machine config grant in talos/talconfig.yaml is applied. See ADR 0011.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: machineconfig-backup-talosconfig
  namespace: system-backup
spec:
  roles:
    - os:admin
