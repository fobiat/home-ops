---
# talos-etcd-backup credential minted 2026-08-16 (os:etcd:backup role, the
# narrowest Talos has: exactly one RPC). See talos-etcd-backup.sops.yaml and
# ADR 0009. UTC rather than Europe/London: VolSync's own cronspecs (see
# cluster-backup-data's replicationsource.yaml, 04:40) have no timezone field,
# so pinning every producer in this window to Etc/UTC keeps the 03:15/03:30
# stagger real instead of drifting an hour twice a year with BST.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-snapshot
        spec:
          # Never, not OnFailure: OnFailure restarts the container in place, so each
          # attempt overwrites the last terminated state and a failed run leaves no
          # exit code behind. Both 2026-08-17 and 2026-08-21 03:15 failures were
          # undiagnosable for this reason. Never gives one retained pod per attempt.
          restartPolicy: Never
          # talosctl's image is FROM scratch (binary + CA certs, no shell), but
          # `etcd snapshot <path>` writes straight to a path, so it needs nothing else.
          initContainers:
            - name: snapshot
              image: ghcr.io/siderolabs/talosctl:v1.13.8
              args:
                - etcd
                - snapshot
                - /staging/etcd.snapshot
                - --talosconfig=/var/run/secrets/talos/talosconfig
                - --nodes=192.168.0.226
              volumeMounts:
                - name: staging
                  mountPath: /staging
                - name: talos-credentials
                  mountPath: /var/run/secrets/talos
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            # A failed snapshot never reaches this container: Kubernetes only runs the
            # pod's containers once every init container has exited zero.
            - name: finalize
              image: docker.io/library/busybox:1.37.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  test -s /staging/etcd.snapshot
                  size=$(wc -c < /staging/etcd.snapshot)
                  # talosctl appends a 32-byte SHA256 trailer after streaming the raw
                  # bbolt pages, the same check talosctl's own etcd snapshot command
                  # uses on the byte count it just wrote: size % 512 == sha256.Size.
                  # https://github.com/siderolabs/talos/blob/v1.13.8/cmd/talosctl/cmd/talos/etcd.go#L374
                  # This will not catch corruption, but it catches a truncated stream.
                  [ $((size % 512)) -eq 32 ]
                  mkdir -p /backup/etcd
                  dest="/backup/etcd/etcd-$(date -u +%Y%m%dT%H%M%SZ).snapshot"
                  mv /staging/etcd.snapshot "$dest"
                  echo "wrote $dest ($size bytes)"
                  cd /backup/etcd
                  ls -1t etcd-*.snapshot | tail -n "+$((RETAIN + 1))" | xargs -r rm -f --
              env:
                - name: RETAIN
                  value: "14"
              volumeMounts:
                - name: staging
                  mountPath: /staging
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: staging
              emptyDir: {}
            - name: talos-credentials
              secret:
                secretName: talos-etcd-backup
            - name: backup-data
              persistentVolumeClaim:
                claimName: cluster-backup-data
