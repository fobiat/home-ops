# NOT ENCRYPTED. NOT A REAL SECRET. DO NOT APPLY TO THE CLUSTER.
#
# The etcd-snapshot CronJob needs a Talos client certificate scoped to the
# os:etcd:backup role, the narrowest role Talos has: it grants exactly one RPC,
# /machine.MachineService/EtcdSnapshot, nothing else. Like the age key, it can't
# be generated from anything in this repository, so it's a one-time manual step.
# See ADR 0009.
#
# 1. From the repo root, with the real admin talosconfig active:
#      mise exec -- talosctl config new \
#        /tmp/talos-etcd-backup.talosconfig \
#        --roles os:etcd:backup \
#        --crt-ttl 8760h \
#        -e 192.168.0.226 -n 192.168.0.226
# 2. Paste the full contents of /tmp/talos-etcd-backup.talosconfig into
#    stringData.talosconfig below, replacing the placeholder line.
# 3. Rename this file to talos-etcd-backup.sops.yaml.
# 4. Encrypt it in place:
#      mise exec -- sops --encrypt --in-place \
#        kubernetes/apps/system-backup/cluster-backup/app/talos-etcd-backup.sops.yaml
# 5. Add it to kustomization.yaml's resources list.
# 6. Set spec.suspend to false in cronjob-etcd-snapshot.yaml.
# 7. Delete /tmp/talos-etcd-backup.talosconfig and this placeholder file.
#
# The certificate expires after the --crt-ttl above (1 year). Nothing renews it
# automatically; repeat this whole procedure to rotate it.
---
apiVersion: v1
kind: Secret
metadata:
  name: talos-etcd-backup
type: Opaque
stringData:
  talosconfig: |
    REPLACE_WITH_TALOSCTL_CONFIG_NEW_OUTPUT
