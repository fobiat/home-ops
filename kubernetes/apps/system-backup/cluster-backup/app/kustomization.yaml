---
# A PVC on local-path, not hostPath, so this namespace stays at Talos's default
# baseline Pod Security level. See ADR 0009.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/namespace
resources:
  - ./pvc.yaml
  - ./cronjob-etcd-snapshot.yaml
  - ./cronjob-machineconfig.yaml
  - ./talos-serviceaccount.yaml
  - ./talos-etcd-backup.sops.yaml
  - ./volsync-repo-pvc.yaml
  - ./cluster-backup-restic-secret.sops.yaml
  - ./replicationsource.yaml
