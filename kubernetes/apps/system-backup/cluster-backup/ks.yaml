---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-backup
  namespace: flux-system
spec:
  targetNamespace: system-backup
  commonMetadata:
    labels:
      app.kubernetes.io/name: cluster-backup
  path: ./kubernetes/apps/system-backup/cluster-backup/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
