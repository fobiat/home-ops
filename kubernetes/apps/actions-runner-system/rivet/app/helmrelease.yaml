---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rivet-runners
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  ref:
    tag: 0.14.2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rivet-runners
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: rivet-runners
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    githubConfigUrl: https://github.com/fobiat/Rivet
    githubConfigSecret: actions-runner-github-app
    controllerServiceAccount:
      namespace: actions-runner-system
      name: actions-runner-controller-gha-rs-controller
    # The listener is a long-running long-poll client with no relation to
    # job size; left to the namespace LimitRange's default it claims 500m
    # cpu / 512Mi it never uses. With four scale sets that alone consumed
    # 2000m of the namespace's 2000m ResourceQuota ceiling before a single
    # job pod could ever be scheduled (rivet-workstation-runners' own
    # listener couldn't even start). Sized down to what the listener
    # actually needs, so the quota stays available for real job pods.
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
    # PLAN.md's phase three section: start low on a single four-core node.
    # The namespace's shared ResourceQuota, not this number, is the real
    # cross-repo ceiling once more than one scale set can be busy at once.
    minRunners: 0
    # Down from 2: two jobs in the same workflow (e.g. cairn's check +
    # manifests) both targeting this scale set could each get a control pod
    # admitted before either progressed to requesting its job-container pod,
    # which is what actually exhausts the namespace quota (see ADR 0015's
    # addendum). 1 doesn't eliminate cross-*repo* races, but it removes the
    # same-repo half of them, which was the larger contributor live.
    maxRunners: 1
    # kubernetes mode: see ADR 0015 for why (no Docker daemon on Talos, no
    # loadable workload kernel modules).
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            # Single node, four cores. See AGENTS.md rule 7. The
            # ResourceQuota and LimitRange in ../controller/app bound the
            # per-step job pods this mode spawns (cargo build/test/clippy
            # here); this bounds the runner's own control pod.
            # In containerMode: kubernetes the actual work (npm/cargo/dotnet/
            # etc.) runs in a *separate* job-container pod this control pod
            # spawns via /home/runner/k8s/index.js; this one just polls and
            # orchestrates. Discovered live that it was sized the same as a
            # real workload (500m), so a job's pod pair (this + its job
            # container) cost 1000m of the namespace's 2000m ResourceQuota
            # before any actual work started — two concurrent jobs across
            # repos was enough to exhaust it outright ("failed to create job
            # pod: exceeded quota"), not just queue politely. Cut to what
            # orchestration actually needs.
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 512Mi
