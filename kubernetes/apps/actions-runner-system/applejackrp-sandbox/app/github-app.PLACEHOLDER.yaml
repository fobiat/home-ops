# NOT ENCRYPTED. NOT A REAL SECRET. DO NOT APPLY TO THE CLUSTER.
#
# Template for the pre-defined secret helmrelease.yaml's
# githubConfigSecret references. The GitHub App this depends on does not
# exist yet. Full steps, including how to create the App itself, are in
# docs/runbooks/actions-runner-controller.md.
#
# Once the App exists and its private key has been downloaded:
#   1. Replace the three REPLACE_WITH_* values below.
#   2. Rename this file to applejackrp-sandbox-runner-github-app.sops.yaml.
#   3. Encrypt it in place: sops --encrypt --in-place \
#        kubernetes/apps/actions-runner-system/applejackrp-sandbox/app/applejackrp-sandbox-runner-github-app.sops.yaml
#   4. Uncomment its line in kustomization.yaml's resources list.
#   5. Set helmrelease.yaml's spec.suspend to false.
#   6. Delete this placeholder file.
---
apiVersion: v1
kind: Secret
metadata:
  name: applejackrp-sandbox-runner-github-app
type: Opaque
stringData:
  github_app_id: REPLACE_WITH_REAL_GITHUB_APP_ID
  github_app_installation_id: REPLACE_WITH_REAL_GITHUB_APP_INSTALLATION_ID
  github_app_private_key: |
    REPLACE_WITH_REAL_GITHUB_APP_PRIVATE_KEY
