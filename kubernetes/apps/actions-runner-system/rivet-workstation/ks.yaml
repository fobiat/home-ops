---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-rivet-workstation
  namespace: flux-system
spec:
  # Suspended 2026-08-24 to free memory for the applejackrp dev server.
  # Reverse with scripts/cluster-restore-nonvital.sh, or by deleting this
  # line. Suspended rather than removed from the parent kustomization,
  # which would prune the app and its data instead of pausing it.
  suspend: true
  dependsOn:
    - name: actions-runner-controller
  targetNamespace: actions-runner-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: actions-runner-rivet-workstation
  path: ./kubernetes/apps/actions-runner-system/rivet-workstation/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
