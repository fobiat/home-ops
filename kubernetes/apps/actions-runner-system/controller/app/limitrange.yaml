---
# containerMode=kubernetes spawns a new pod per workflow step, using
# whatever (or no) resources: block the workflow YAML declares. Without a
# default here, an unbounded step pod is exactly the runaway matrix build
# PLAN.md's phase three section warns about. `max` also caps any step that
# does declare its own resources, so the ResourceQuota's ceiling can't be
# reached by one oversized pod.
#
# default.memory raised 512Mi -> 1Gi and max.memory 1Gi -> 2Gi on
# 2026-08-22: AppleJackRP-sandbox's site-build job (astro build + pagefind
# search-index generation over 66 HTML pages, node:22, no resources: of its
# own so it inherited these defaults) was OOM-killed mid-pagefind (exit 137,
# confirmed in the job's own logs, not inferred) at the 512Mi/1Gi ceiling.
# cpu is untouched - the failure was memory-shaped, not CPU-shaped. See the
# ResourceQuota in this same directory for the matching bump and the margin
# math this stays inside.
apiVersion: v1
kind: LimitRange
metadata:
  name: actions-runner-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 1Gi
      max:
        cpu: "1"
        memory: 2Gi
