---
# Hard ceiling for the whole actions-runner-system namespace: runner control
# pods, listener pods and every per-step job pod containerMode=kubernetes
# spawns. Once this is exhausted, further pods stay Pending instead of
# starving the platform, the failure mode PLAN.md's phase three section
# calls out by name. See ADR 0015 and the LimitRange in this same directory,
# which is what stops an unbounded workflow step pod hitting this quota in
# the first place.
#
# limits.cpu is sized deliberately tight, not just conservative: containerMode:
# kubernetes runs each job as a *pair* of pods (a runner control pod, plus a
# separate job-container pod the runner spawns via its own k8s hook once it
# starts). ARC's own reconciliation loop retries a blocked *control* pod
# gracefully every 30s, but a blocked *job-container* pod does not retry at
# all — it hard-fails the workflow run outright ("failed to create job pod:
# exceeded quota"), confirmed live once two repos' jobs landed close together.
# The fix isn't more headroom, it's making sure a second job's control pod is
# never admitted while a first job's pair is still running, so any collision
# is caught at the gracefully-retried stage instead of the hard-failing one:
# baseline (4 listeners @ 100m + controller @ 200m = 600m) + one job pair
# (control @ 250m + job-container @ 500m, the LimitRange default = 750m)
# leaves only 150m free, less than a second control pod (250m) needs, so it
# queues instead of racing. This is why runners behave sequentially rather
# than concurrently — not a scheduling policy, a capacity one. Tighter than
# the original 2 cores (50% of the node), this is 1.5 (37.5%), an even wider
# platform margin, not a narrower one.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: actions-runner-system
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "1500m"
    limits.memory: 4Gi
