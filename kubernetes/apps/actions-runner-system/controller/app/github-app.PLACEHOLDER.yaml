# NOT ENCRYPTED. NOT A REAL SECRET. DO NOT APPLY TO THE CLUSTER.
#
# Shared credential for one GitHub App installed on every repo this
# namespace runs a scale set for (AppleJackRP-sandbox, Rivet,
# rivet-workstation). Each app's helmrelease.yaml references this same
# secret name as its pre-defined githubConfigSecret. The App does not exist
# yet. Full steps, including how to create it and install it on all three
# repos, are in docs/runbooks/actions-runner-controller.md.
#
# Once the App exists and its private key has been downloaded:
#   1. Replace the three REPLACE_WITH_* values below.
#   2. Rename this file to github-app.sops.yaml.
#   3. Encrypt it in place: sops --encrypt --in-place \
#        kubernetes/apps/actions-runner-system/controller/app/github-app.sops.yaml
#   4. Uncomment its line in kustomization.yaml's resources list.
#   5. Set spec.suspend to false in every scale set's helmrelease.yaml that
#      is ready to go live (they can be flipped independently).
#   6. Delete this placeholder file.
---
apiVersion: v1
kind: Secret
metadata:
  name: actions-runner-github-app
type: Opaque
stringData:
  github_app_id: REPLACE_WITH_REAL_GITHUB_APP_ID
  github_app_installation_id: REPLACE_WITH_REAL_GITHUB_APP_INSTALLATION_ID
  github_app_private_key: |
    REPLACE_WITH_REAL_GITHUB_APP_PRIVATE_KEY
