---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: applejackrp-sandbox
spec:
  # Guessed at the ghcr path AppleJackRP-sandbox's own name would produce.
  # Confirm against whatever the repo's server-image build workflow actually
  # pushes once that workflow exists, and correct this if it differs.
  image: ghcr.io/fobiat/applejackrp-sandbox
  interval: 5m
  # Private package, same as cairn-web: needs read:packages credentials.
  # Named applejackrp-ghcr-pull-secret, not ghcr-pull-secret: that name
  # collides with cairn's own flux-system copy (kubernetes/apps/cairn/
  # automation/app/ghcr-pull-secret.sops.yaml), same namespace, same name -
  # two Kustomizations racing to own one object, last reconcile wins. Found
  # 2026-08-22 after this secret kept reverting to cairn's older content.
  secretRef:
    name: applejackrp-ghcr-pull-secret
