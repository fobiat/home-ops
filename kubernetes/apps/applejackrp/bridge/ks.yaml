---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applejackrp-bridge
  namespace: flux-system
spec:
  targetNamespace: applejackrp
  # applejackrp-db, not just the operator: the deployment reads the app
  # credentials out of the applejackrp-db-app Secret, and CNPG only creates
  # that once the cluster has bootstrapped.
  dependsOn:
    - name: applejackrp-namespace
    - name: applejackrp-registry-auth
    - name: applejackrp-db
  commonMetadata:
    labels:
      app.kubernetes.io/name: applejackrp-bridge
  path: ./kubernetes/apps/applejackrp/bridge/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
