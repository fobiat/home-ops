---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applejackrp-namespace
  namespace: flux-system
spec:
  targetNamespace: applejackrp
  path: ./kubernetes/apps/applejackrp/namespace/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
