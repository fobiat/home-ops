---
# No readiness/liveness probes: this isn't HTTP, and SDR's whole point is that
# nothing else can be relied on to be listening on a known port either (see
# server/entrypoint.sh in AppleJackRP-sandbox - direct-connect, the one mode
# with a probeable port, is opt-in and off by default). A crashed process
# still gets restarted by the container runtime regardless of probes; what
# probes would add here is detecting a hang, and guessing at a check for that
# without a verified protocol risks killing a healthy server on a bad probe
# instead. Revisit once there's a confirmed way to ask this server "are you
# actually serving."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applejackrp-dev
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Not RollingUpdate: the PVC below is ReadWriteOnce, and a second pod
  # trying to mount it before the first releases it would just hang Pending.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: applejackrp-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: applejackrp-dev
    spec:
      containers:
        - name: server
          # {"$imagepolicy": "flux-system:applejackrp-sandbox"}
          # No ImageUpdateAutomation exists yet to act on that setter (see
          # automation/app/kustomization.yaml's comment on why), so this tag
          # is bumped by hand until that's wired up. Pinned to the first
          # published build rather than :latest, since :latest would drift
          # silently with no automation watching for it.
          image: ghcr.io/fobiat/applejackrp-sandbox:20260824192458
          # The dedicated server reads console commands (`game <ident>
          # <mapident>`) from stdin, and Kubernetes only wires stdin up for a
          # container created with these two set - it can't be attached
          # retroactively. Needed to load the actual gamemode/map rather than
          # sitting at the bare console, since +project alone doesn't do that.
          stdin: true
          tty: true
          env:
            - name: SERVER_NAME
              value: "AppleJackRP Dev"
            # Load the published package rather than the local .sbproj. The
            # image ships no Libraries/ (server/Dockerfile copies only the
            # sbproj, Code/, Assets/ and ProjectSettings/), so the local path
            # cannot resolve the sbproj's PackageReferences: the project never
            # finishes loading, NetworkBootstrap never runs, no lobby is
            # created and the server shows up nowhere. By ident the server
            # fetches the package and its references itself.
            # Only works once fobiat.applejackrp is actually published.
            - name: SBOX_GAME_IDENT
              value: "fobiat.applejackrp"
            # The map is its own published package, passed as +game's second
            # argument. Ident is the sbproj's Metadata.MapList entry, not the
            # bare Hammer name rp_downtown_3t.
            - name: SBOX_MAP_IDENT
              value: "thieves.rpdowntown3t"
            # Point the gamemode's HostedDocumentStore at the in-cluster
            # bridge. Without these the entrypoint leaves storage local, and
            # local means sbox/data inside the container layer, which no
            # volume backs: state is lost on every restart.
            - name: BRIDGE_URL
              value: "http://applejackrp-bridge.applejackrp.svc.cluster.local:8080"
            - name: BRIDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: applejackrp-bridge-key
                  key: api-key
            - name: GSLT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: applejackrp-gslt
                  key: token
                  # Registered against Steam AppID 590830 (s&box's client app,
                  # not the anonymous-download dedicated-server tool app
                  # 1892930 - GSLT registration requires Steam-verified
                  # ownership, which only the client app has). Required, not
                  # optional: per the SDR join-flow research, the GSLT is what
                  # gives the server a persistent Steam ID to generate a join
                  # link from.
                  optional: false
          volumeMounts:
            - name: wine-data
              mountPath: /home/container/.wine
          # Reasoned starting point, not measured: Wine running a Source
          # 2-class engine under emulation is heavier than anything else on
          # this single 4-core node. Corrected 2026-08-22: the node has
          # 8093776Ki (~7.7GiB) allocatable, not 32GB - that number
          # conflated the host's spare capacity with what's actually given
          # to this VM.
          #
          # 2026-08-22: the 1Gi/2Gi smoke-test shrink here OOM-killed the
          # whole node repeatedly (kube-apiserver included) once the server
          # loaded a real map - 2Gi wasn't a safe ceiling, it was just what
          # fit at the time. Fixed by suspending the monitoring HelmReleases
          # (kube-prometheus-stack, loki, alloy; ~1.6Gi requested) rather than
          # by shrinking this further, since observability isn't essential to
          # keep the cluster or this server running. Revisit resizing this
          # once the pending VM RAM bump (tasks.md, blocked on Kyle since
          # 2026-08-21) lands and monitoring can come back.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Not runAsNonRoot / readOnlyRootFilesystem: the base image runs
            # as root by default and Wine writes across its prefix at
            # runtime, both reproduced locally in this session. Untested
            # whether either could be tightened without breaking Wine.
      volumes:
        - name: wine-data
          persistentVolumeClaim:
            claimName: applejackrp-wine-data
