---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.16
      sourceRef:
        kind: HelmRepository
        name: stakater
  # See kube-prometheus-stack's HelmRelease for why remediation/cleanup are set.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Single node, four cores. See AGENTS.md rule 7.
    reloader:
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
