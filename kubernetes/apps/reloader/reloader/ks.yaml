---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  # Suspended 2026-08-24 to free memory for the applejackrp dev server.
  # Reverse with scripts/cluster-restore-nonvital.sh, or by deleting this
  # line. Suspended rather than removed from the parent kustomization,
  # which would prune the app and its data instead of pausing it.
  suspend: true
  targetNamespace: reloader
  commonMetadata:
    labels:
      app.kubernetes.io/name: reloader
  path: ./kubernetes/apps/reloader/reloader/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
