---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs-proxy
    spec:
      containers:
        - name: caddy
          image: docker.io/library/caddy:2.11.4-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          # Single node, four cores. See AGENTS.md rule 7.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: caddyfile
          configMap:
            name: docs-proxy-caddyfile
---
apiVersion: v1
kind: Service
metadata:
  name: docs-proxy
spec:
  selector:
    app.kubernetes.io/name: docs-proxy
  ports:
    - port: 80
      targetPort: 80
