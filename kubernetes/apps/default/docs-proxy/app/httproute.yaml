---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs-proxy
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Docs
    gethomepage.dev/description: Cluster documentation, mirrored from GitHub Pages
    gethomepage.dev/group: Cluster
    gethomepage.dev/icon: mkdocs.png
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - docs.lab.fobiat.dev
  rules:
    - backendRefs:
        - name: docs-proxy
          port: 80
