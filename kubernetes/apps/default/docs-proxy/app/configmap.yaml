---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-proxy-caddyfile
data:
  Caddyfile: |
    :80 {
      # GitHub Pages serves a project page under /home-ops/, not the bare host.
      rewrite * /home-ops{uri}
      reverse_proxy https://fobiat.github.io {
        header_up Host fobiat.github.io
      }
    }
