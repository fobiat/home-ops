---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  targetNamespace: default
  dependsOn:
    - name: network-gateway
  commonMetadata:
    labels:
      app.kubernetes.io/name: homepage
  path: ./kubernetes/apps/default/homepage/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
