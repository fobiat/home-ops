---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jameswynn
spec:
  interval: 1h
  url: https://jameswynn.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: jameswynn
  # See kube-prometheus-stack's HelmRelease for why remediation/cleanup are set.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # v1.x refuses to serve without this: https://gethomepage.dev/installation/#homepage_allowed_hosts
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: home.lab.fobiat.dev
    # Cilium Gateway API handles ingress, not the chart's nginx-flavoured Ingress resource.
    ingress:
      main:
        enabled: false
    # Single node, four cores. See AGENTS.md rule 7.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Cluster-scoped, read-only get/list on namespaces/pods/nodes/ingresses/
    # HTTPRoutes/gateways, needed for config.kubernetes discovery below.
    enableRbac: true
    serviceAccount:
      create: true
    config:
      settingsString: |
        title: Home Ops
        headerStyle: boxed
        useEqualHeights: true
        layout:
          Overview:
            style: row
            columns: 3
          Cluster:
            style: row
            columns: 2
      bookmarks:
        - Monitoring:
            - Node detail:
                - icon: grafana.png
                  href: https://grafana.lab.fobiat.dev/d/rYdddlPWk
                  description: CPU, memory, disk and network
            - Flux status:
                - icon: flux-cd.png
                  href: https://grafana.lab.fobiat.dev/d/flux-cluster
                  description: Reconciliation and delivery
            - Certificates:
                - icon: cert-manager.png
                  href: https://grafana.lab.fobiat.dev/d/cert-manager
                  description: Issuance and renewal
        - Daily:
            - Cairn:
                - abbr: CA
                  href: https://cairn.lab.fobiat.dev/at?q=Cambridge
                  description: Local warnings and source freshness
            - VPS home:
                - abbr: VP
                  href: http://home.dev.fobiat.dev
                  description: News, development and usage
      # A real list prevents the chart's sample services from appearing.
      # HTTPRoute annotations still discover each app in the Cluster group.
      services:
        - Overview:
            - Node headroom:
                href: https://grafana.lab.fobiat.dev/d/rYdddlPWk
                icon: grafana.png
                description: Current node utilisation from Prometheus
                widget:
                  type: prometheusmetric
                  url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                  refreshInterval: 60000
                  metrics:
                    - label: CPU
                      query: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
                      format:
                        type: percent
                        options:
                          maximumFractionDigits: 0
                    - label: Memory
                      query: 1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)
                      format:
                        type: percent
                        options:
                          maximumFractionDigits: 0
            - Needs attention:
                href: https://grafana.lab.fobiat.dev/alerting/list
                icon: prometheus.png
                description: Firing alerts and pod health
                widget:
                  type: prometheusmetric
                  url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                  refreshInterval: 60000
                  metrics:
                    - label: Alerts
                      query: >-
                        count(ALERTS{alertstate="firing",alertname!~"Watchdog|InfoInhibitor"}) or
                        (count(ALERTS{alertstate="firing",alertname="Watchdog"}) * 0)
                      format:
                        type: number
                    - label: Pending pods
                      query: sum(kube_pod_status_phase{phase="Pending"})
                      format:
                        type: number
                    - label: Restarts / hour
                      query: sum(increase(kube_pod_container_status_restarts_total[1h]))
                      format:
                        type: number
                        options:
                          maximumFractionDigits: 0
            - Service availability:
                href: https://status.lab.fobiat.dev
                icon: gatus.png
                description: App health checks maintained by each service
                widget:
                  type: gatus
                  url: http://gatus.default.svc.cluster.local
                  fields: ["up", "down", "uptime"]
      kubernetes:
        mode: cluster
        gateway: true
      widgets:
        - datetime:
            text_size: md
            locale: en-GB
            format:
              dateStyle: medium
              timeStyle: short
              hourCycle: h23
              timeZone: Europe/London
        - openmeteo:
            label: Cambridge
            latitude: 52.2053
            longitude: 0.1218
            timezone: Europe/London
            units: metric
            cache: 15
            format:
              maximumFractionDigits: 1
        - resources:
            backend: resources
            label: Homepage process
            expanded: true
            cpu: true
            memory: true
        - search:
            provider: duckduckgo
            target: _blank
