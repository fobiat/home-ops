---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jameswynn
spec:
  interval: 1h
  url: https://jameswynn.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: jameswynn
  # See kube-prometheus-stack's HelmRelease for why remediation/cleanup are set.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # v1.x refuses to serve without this: https://gethomepage.dev/installation/#homepage_allowed_hosts
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: home.lab.fobiat.dev
    # Cilium Gateway API handles ingress, not the chart's nginx-flavoured Ingress resource.
    ingress:
      main:
        enabled: false
    # Single node, four cores. See AGENTS.md rule 7.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Cluster-scoped, read-only get/list on namespaces/pods/nodes/ingresses/
    # HTTPRoutes/gateways, needed for config.kubernetes discovery below.
    enableRbac: true
    serviceAccount:
      create: true
    config:
      settingsString: |
        title: Home Ops
        headerStyle: boxed
        layout:
          Cluster:
            style: row
            columns: 2
      bookmarks: []
      # Empty, not absent: with no services key at all the chart ships its own
      # sample services.yaml, and Homepage renders the three "My First Service"
      # demo entries alongside the discovered ones.
      services: []
      # Services come from gethomepage.dev/* annotations on each app's own
      # HTTPRoute (see e.g. grafana's), not a static list, so a new app shows
      # up without a Homepage edit. The old static list carried a dead
      # Prometheus link with no HTTPRoute behind it.
      kubernetes:
        mode: cluster
        gateway: true
      widgets:
        - resources:
            backend: resources
            expanded: true
            cpu: true
            memory: true
        - search:
            provider: duckduckgo
            target: _blank
