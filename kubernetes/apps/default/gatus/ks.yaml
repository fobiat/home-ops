---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus
  namespace: flux-system
spec:
  targetNamespace: default
  dependsOn:
    - name: local-path-provisioner
    - name: network-gateway
    - name: volsync
  commonMetadata:
    labels:
      app.kubernetes.io/name: gatus
  path: ./kubernetes/apps/default/gatus/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
