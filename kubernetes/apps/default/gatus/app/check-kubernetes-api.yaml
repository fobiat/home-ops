---
# The Kubernetes API isn't owned by any app directory in this repo, so its
# check lives beside Gatus itself rather than beside a manifest that doesn't
# exist. Every other check sits next to the app it tests; see docs/gatus.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-check-kubernetes-api
  labels:
    gatus.io/enabled: "true"
data:
  kubernetes-api.yaml: |
    endpoints:
      - name: kubernetes-api
        group: cluster
        url: "tcp://kubernetes.default.svc.cluster.local:443"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
