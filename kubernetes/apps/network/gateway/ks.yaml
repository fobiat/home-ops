---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-gateway
  namespace: flux-system
spec:
  targetNamespace: network
  dependsOn:
    - name: network-certificates
    - name: network-lb-ipam
  commonMetadata:
    labels:
      app.kubernetes.io/name: network-gateway
  path: ./kubernetes/apps/network/gateway/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
