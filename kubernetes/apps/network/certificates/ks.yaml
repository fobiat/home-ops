---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-certificates
  namespace: flux-system
spec:
  targetNamespace: network
  dependsOn:
    - name: cert-manager-cluster-issuers
  commonMetadata:
    labels:
      app.kubernetes.io/name: network-certificates
  path: ./kubernetes/apps/network/certificates/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
