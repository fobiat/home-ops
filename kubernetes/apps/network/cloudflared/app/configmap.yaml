---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yaml: |
    tunnel: 50e8490f-820b-4e20-a076-65254e8ad157
    credentials-file: /etc/cloudflared/creds/credentials.json
    protocol: http2
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # Lets this tunnel also carry UDP/private-network traffic for WARP-enrolled
    # devices (needed for applejack's game traffic, which can't ride the
    # hostname ingress below - that's HTTP/HTTPS/TCP only). The actual route
    # (CIDR -> tunnel) and the Access enrollment policy are Cloudflare account
    # objects, not config here; see kubernetes/apps/applejack/network.
    warp-routing:
      enabled: true
    ingress:
      - hostname: insights.fobiat.dev
        service: https://cilium-gateway-external.network-public.svc.cluster.local:443
        originRequest:
          originServerName: insights.fobiat.dev
          httpHostHeader: insights.fobiat.dev
      - service: http_status:404
