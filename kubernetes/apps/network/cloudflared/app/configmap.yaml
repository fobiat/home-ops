---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yaml: |
    tunnel: 50e8490f-820b-4e20-a076-65254e8ad157
    credentials-file: /etc/cloudflared/creds/credentials.json
    protocol: http2
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: insights.fobiat.dev
        service: https://cilium-gateway-external.network-public.svc.cluster.local:443
        originRequest:
          originServerName: insights.fobiat.dev
          httpHostHeader: insights.fobiat.dev
      - hostname: cairn.fobiat.dev
        service: https://cilium-gateway-external.network-public.svc.cluster.local:443
        originRequest:
          # The gateway picks its listener by SNI, so both fields have to name
          # the public hostname. Sending the gateway's own name here lands on
          # the insights listener and serves the wrong certificate.
          originServerName: cairn.fobiat.dev
          httpHostHeader: cairn.fobiat.dev
      - service: http_status:404
