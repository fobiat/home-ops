---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
  # See kube-prometheus-stack's HelmRelease for why remediation/cleanup are set.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    sources:
      - gateway-httproute
    domainFilters:
      - lab.fobiat.dev
    txtOwnerId: home-ops
    # Single node, four cores. See AGENTS.md rule 7.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    # The chart defaults to failureThreshold 2 at a 10s period, so ~20s of
    # unresponsiveness restarts the container. On this node that is not a
    # liveness signal: page-cache reclaim evicts executable pages and a process
    # blocks faulting them back in, which is the same mechanism that makes
    # kube-scheduler miss its 5s lease. It restarted external-dns 198 times and
    # the webhook 184, both within ten seconds of each other, which is a
    # node-wide stall rather than either process hanging. 90s to notice a real
    # hang is fine for something that reconciles once a minute.
    livenessProbe:
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.1.3
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-credentials
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-credentials
                key: user
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-credentials
                key: password
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        # Same reasoning as the external-dns container above.
        livenessProbe:
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
