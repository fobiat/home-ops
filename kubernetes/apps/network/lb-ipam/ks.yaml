---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-lb-ipam
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: network-lb-ipam
  path: ./kubernetes/apps/network/lb-ipam/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
