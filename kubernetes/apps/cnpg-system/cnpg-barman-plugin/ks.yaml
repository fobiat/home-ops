---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman-plugin
  namespace: flux-system
spec:
  targetNamespace: cnpg-system
  dependsOn:
    - name: cnpg-operator
  commonMetadata:
    labels:
      app.kubernetes.io/name: cnpg-barman-plugin
  path: ./kubernetes/apps/cnpg-system/cnpg-barman-plugin/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
