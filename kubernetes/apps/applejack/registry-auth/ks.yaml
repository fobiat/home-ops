---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applejack-registry-auth
  namespace: flux-system
spec:
  targetNamespace: applejack
  dependsOn:
    - name: applejack-namespace
  path: ./kubernetes/apps/applejack/registry-auth/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
