---
# Attaching the pull secret to the namespace's default ServiceAccount means
# every pod here that doesn't set its own imagePullSecrets picks it up
# automatically (standard kubelet behaviour), same as cairn's registry-auth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: applejack
imagePullSecrets:
  - name: ghcr-pull-secret
