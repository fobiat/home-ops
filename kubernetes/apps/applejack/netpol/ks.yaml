---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applejack-netpol
  namespace: flux-system
spec:
  targetNamespace: applejack
  commonMetadata:
    labels:
      app.kubernetes.io/name: applejack-netpol
  dependsOn:
    - name: applejack-namespace
  path: ./kubernetes/apps/applejack/netpol/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
