---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applejack
  namespace: flux-system
spec:
  targetNamespace: applejack
  dependsOn:
    - name: applejack-db
    - name: applejack-registry-auth
  path: ./infra/kubernetes/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: applejack
  # Needed once infra/kubernetes/app carries a SOPS-encrypted secret of its
  # own; harmless while it doesn't (see cairn's app/ks.yaml).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
