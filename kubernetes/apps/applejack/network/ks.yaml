---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applejack-network
  namespace: flux-system
spec:
  targetNamespace: applejack
  dependsOn:
    - name: applejack-namespace
  path: ./kubernetes/apps/applejack/network/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
