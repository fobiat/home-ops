---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-collect
spec:
  parentRefs:
    - name: external
      sectionName: insights
  hostnames:
    - insights.fobiat.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/send
      backendRefs:
        - name: umami
          namespace: umami
          port: 3000
    - matches:
        - path:
            type: Exact
            value: /script.js
      backendRefs:
        - name: umami
          namespace: umami
          port: 3000
