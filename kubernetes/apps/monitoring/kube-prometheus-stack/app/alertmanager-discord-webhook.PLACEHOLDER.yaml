# NOT ENCRYPTED. NOT A REAL SECRET. DO NOT APPLY TO THE CLUSTER.
#
# This is a template for the real secret Alertmanager needs, referenced by
# alertmanager.alertmanagerSpec.secrets in helmrelease.yaml. A home-ops
# Discord webhook doesn't exist yet.
#
# Once a Discord webhook URL is available:
#   1. Replace REPLACE_WITH_REAL_DISCORD_WEBHOOK_URL below with the real value.
#   2. Rename this file to alertmanager-discord-webhook.sops.yaml.
#   3. Encrypt it in place: sops --encrypt --in-place \
#        kubernetes/apps/monitoring/kube-prometheus-stack/app/alertmanager-discord-webhook.sops.yaml
#   4. Add it to kustomization.yaml's resources list.
#   5. Delete this placeholder file.
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-discord-webhook
type: Opaque
stringData:
  webhook-url: REPLACE_WITH_REAL_DISCORD_WEBHOOK_URL
