---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - grafana.lab.fobiat.dev
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
