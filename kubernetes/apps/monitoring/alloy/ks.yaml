---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  targetNamespace: monitoring
  # Not a hard runtime requirement (Alloy retries writes), but avoids Alloy
  # reconciling against a HelmRepository that doesn't exist yet.
  dependsOn:
    - name: loki
  commonMetadata:
    labels:
      app.kubernetes.io/name: alloy
  path: ./kubernetes/apps/monitoring/alloy/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
