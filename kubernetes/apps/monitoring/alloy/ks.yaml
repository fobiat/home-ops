---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  # Suspended 2026-08-24 to free memory for the applejackrp dev server.
  # Reverse with scripts/cluster-restore-nonvital.sh, or by deleting this
  # line. Suspended rather than removed from the parent kustomization,
  # which would prune the app and its data instead of pausing it.
  suspend: true
  targetNamespace: monitoring
  # Not a hard runtime requirement (Alloy retries writes), but avoids Alloy
  # reconciling against a HelmRepository that doesn't exist yet.
  dependsOn:
    - name: loki
  commonMetadata:
    labels:
      app.kubernetes.io/name: alloy
  path: ./kubernetes/apps/monitoring/alloy/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
