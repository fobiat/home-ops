---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# grafana_dashboard: "1" is the label kube-prometheus-stack's Grafana sidecar
# scans for (grafana.sidecar.dashboards, searchNamespace: ALL). Every
# configMapGenerator entry below picks it up through generatorOptions rather
# than repeating it seven times.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    files:
      - node-exporter-full.json
  - name: grafana-dashboard-cilium-agent
    files:
      - cilium-agent.json
  - name: grafana-dashboard-cilium-operator
    files:
      - cilium-operator.json
  - name: grafana-dashboard-hubble
    files:
      - hubble.json
  - name: grafana-dashboard-flux-cluster
    files:
      - flux-cluster.json
  - name: grafana-dashboard-flux-control-plane
    files:
      - flux-control-plane.json
  - name: grafana-dashboard-cert-manager
    files:
      - cert-manager.json
