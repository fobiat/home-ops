---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: flux-system
spec:
  targetNamespace: monitoring
  dependsOn:
    - name: kube-prometheus-stack
  commonMetadata:
    labels:
      app.kubernetes.io/name: grafana-dashboards
  path: ./kubernetes/apps/monitoring/grafana-dashboards/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
