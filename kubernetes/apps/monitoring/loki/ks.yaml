---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  targetNamespace: monitoring
  dependsOn:
    - name: local-path-provisioner
  commonMetadata:
    labels:
      app.kubernetes.io/name: loki
  path: ./kubernetes/apps/monitoring/loki/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
