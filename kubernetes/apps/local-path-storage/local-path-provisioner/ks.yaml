---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: local-path-provisioner
  path: ./kubernetes/apps/local-path-storage/local-path-provisioner/app
  prune: true
  wait: true
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
