---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync
  namespace: flux-system
spec:
  targetNamespace: volsync-system
  dependsOn:
    - name: local-path-provisioner
  commonMetadata:
    labels:
      app.kubernetes.io/name: volsync
  path: ./kubernetes/apps/volsync-system/volsync/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
