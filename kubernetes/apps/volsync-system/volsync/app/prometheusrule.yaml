---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: volsync.rules
      rules:
        # A dead controller does not set this to 1, it stops exporting the series
        # altogether, so a threshold alert would stay silent forever. That is why
        # absent() is here and why it could only be added once a ReplicationSource
        # existed to make the series legitimately present.
        - alert: VolSyncMetricsAbsent
          expr: absent(volsync_volume_out_of_sync)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: VolSync is exporting no metrics
            description: >-
              The VolSync controller is not reporting on any replicated volume.
              It has most likely been deleted or is crashlooping, which means
              backups have stopped without any of the other alerts firing.
        - alert: VolSyncVolumeOutOfSync
          expr: volsync_volume_out_of_sync == 1
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: A VolSync replicated volume is out of sync
            description: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} has not completed
              a sync within its schedule, so its most recent backup is older than
              it should be.
        - alert: VolSyncMissedInterval
          expr: increase(volsync_missed_intervals_total[24h]) > 0
          labels:
            severity: warning
          annotations:
            summary: A VolSync sync interval was missed
            description: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} missed a
              scheduled sync in the last 24 hours. One mover runs at a time here,
              so overlapping schedules are the usual cause.
