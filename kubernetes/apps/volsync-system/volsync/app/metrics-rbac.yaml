---
# VolSync 0.15.0 dropped kube-rbac-proxy for controller-runtime's own metrics
# authn/authz, so Prometheus needs an explicit grant on /metrics. The chart
# creates the ClusterRole; only the binding is ours.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volsync-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volsync-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: monitoring
