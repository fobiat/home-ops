---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Headlamp
    gethomepage.dev/description: Cluster management UI
    gethomepage.dev/group: Cluster
    gethomepage.dev/icon: headlamp.png
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - headlamp.lab.fobiat.dev
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
