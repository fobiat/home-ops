---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cairn-db
  namespace: flux-system
spec:
  targetNamespace: cairn
  dependsOn:
    - name: cairn-source
    - name: cairn-namespace
    - name: cnpg-operator
  path: ./infra/kubernetes/database
  prune: true
  # false, not true: confirmed live that wait: true and healthChecks are
  # additive, not one overriding the other. With wait: true, the previous
  # two fixes (scoping healthChecks to the Cluster, then to the Pod) both
  # still failed on the exact same error, because Flux was separately
  # waiting on every object in the inventory regardless of what
  # healthChecks named. cairn-backup is local-path with
  # WaitForFirstConsumer, which never reaches Bound until the backup
  # CronJob's first scheduled run actually mounts it, so that generic
  # inventory-wide wait could never succeed on its own. healthChecks below
  # is the actual and only readiness gate now: still real (still won't
  # report Ready until Postgres is actually up), just no longer entangled
  # with a PVC that structurally can't bind on this timeline.
  wait: false
  # The target is the instance Pod, not the CNPG Cluster CR: confirmed live
  # that Cluster never sets status.observedGeneration at all (empty, against
  # metadata.generation: 1), which Flux's generic kstatus reader requires to
  # trust a Ready condition, Cluster or not. A forced `flux reconcile` still
  # timed out waiting on it. Pods follow the standard convention kstatus
  # already understands. Single instance only (see database's own comments),
  # so the name is stable; would need revisiting if this ever scales beyond
  # one replica.
  healthChecks:
    - apiVersion: v1
      kind: Pod
      name: cairn-postgres-1
      namespace: cairn
  interval: 1h
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: cairn
