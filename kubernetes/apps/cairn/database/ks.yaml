---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cairn-db
  namespace: flux-system
spec:
  targetNamespace: cairn
  dependsOn:
    - name: cairn-source
    - name: cairn-namespace
    - name: cnpg-operator
  path: ./infra/kubernetes/database
  prune: true
  wait: true
  interval: 1h
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: cairn
