---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cairn-db
  namespace: flux-system
spec:
  targetNamespace: cairn
  dependsOn:
    - name: cairn-source
    - name: cairn-namespace
    - name: cnpg-operator
  path: ./infra/kubernetes/database
  prune: true
  wait: true
  # Explicit health checks, not the default "wait for everything in the
  # inventory": cairn-backup is local-path with WaitForFirstConsumer, which
  # never reaches Bound until the backup CronJob's first scheduled run
  # actually mounts it. Waiting on it made this Kustomization NotReady
  # indefinitely even though the database itself was healthy the whole time.
  #
  # The target is the instance Pod, not the CNPG Cluster CR: confirmed live
  # that Cluster never sets status.observedGeneration at all (empty, against
  # metadata.generation: 1), which Flux's generic kstatus reader requires to
  # trust a Ready condition, Cluster or not. A forced `flux reconcile` still
  # timed out waiting on it. Pods follow the standard convention kstatus
  # already understands. Single instance only (see database's own comments),
  # so the name is stable; would need revisiting if this ever scales beyond
  # one replica.
  healthChecks:
    - apiVersion: v1
      kind: Pod
      name: cairn-postgres-1
      namespace: cairn
  interval: 1h
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: cairn
