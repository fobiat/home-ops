---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cairn
  namespace: flux-system
spec:
  # Suspended 2026-08-24 to free memory for the applejackrp dev server.
  # Reverse with scripts/cluster-restore-nonvital.sh, or by deleting this
  # line. Suspended rather than removed from the parent kustomization,
  # which would prune the app and its data instead of pausing it.
  suspend: true
  targetNamespace: cairn
  dependsOn:
    - name: cairn-db
    - name: cairn-registry-auth
    - name: network-gateway
    - name: kube-prometheus-stack
  path: ./infra/kubernetes/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: cairn
  # Needed once infra/kubernetes/app carries a SOPS-encrypted ghcr-pull-secret
  # (see automation/); harmless while it doesn't.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
