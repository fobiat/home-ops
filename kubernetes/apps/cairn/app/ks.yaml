---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cairn
  namespace: flux-system
spec:
  targetNamespace: cairn
  dependsOn:
    - name: cairn-db
    - name: network-gateway
    - name: kube-prometheus-stack
  path: ./infra/kubernetes/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: cairn
  # Needed once infra/kubernetes/app carries a SOPS-encrypted ghcr-pull-secret
  # (see automation/); harmless while it doesn't.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
