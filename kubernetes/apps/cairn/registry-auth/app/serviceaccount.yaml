---
# cairn-ingest's CronJob (infra/kubernetes/app in the cairn repo) runs under
# the namespace's default ServiceAccount and doesn't declare its own
# imagePullSecrets, unlike cairn-web's Deployment. Attaching the pull secret
# here means every pod in the namespace that doesn't set its own
# imagePullSecrets picks this one up automatically (standard kubelet
# behaviour), so the CronJob doesn't need a matching change in that repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cairn
imagePullSecrets:
  - name: ghcr-pull-secret
