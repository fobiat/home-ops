---
extends: default

rules:
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  indentation:
    indent-sequences: whatever
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  truthy:
    check-keys: false

ignore: |
  .archive/
  kubernetes/**/*.sops.yaml
  talos/**/*.sops.yaml
  # flux bootstrap regenerates this, never hand-edited
  **/gotk-components.yaml
  # vendored upstream CRDs, never hand-edited; their generated
  # description fields run well past 120 characters
  **/volsync-system/snapshot-controller-crds/app/*.yaml
