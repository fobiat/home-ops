[settings]
experimental = true
pipx.uvx = true

[env]
_.file = ".env"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
TALHELPER_SECRET_FILE = "{{config_root}}/talos/talsecret.sops.yaml"

[tools]
"aqua:FiloSottile/age" = "1.3.1"
"aqua:budimanjojo/talhelper" = "3.1.16"
"aqua:fluxcd/flux2" = "2.9.4"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.52.0"
"aqua:helmfile/helmfile" = "1.7.3"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:siderolabs/talos" = "1.13.8"
"aqua:yannh/kubeconform" = "0.8.0"
helm = "3.20.1"
kubectl = "1.36.3"
python = "3.13"
yq = "4.48.1"

[tools."pipx:yamllint"]
version = "1.37.1"
uvx_args = "--python 3.13"

[tools."pipx:flux-local"]
version = "7.7.1"
uvx_args = "--python 3.13"
