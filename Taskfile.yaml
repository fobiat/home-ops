---
version: "3"

vars:
  TALOS_DIR: "{{.ROOT_DIR}}/talos"
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  BOOTSTRAP_DIR: "{{.ROOT_DIR}}/bootstrap"

includes:
  talos: .taskfiles/talos.yaml
  flux: .taskfiles/flux.yaml
  sops: .taskfiles/sops.yaml
  bootstrap: .taskfiles/bootstrap.yaml
  docs: .taskfiles/docs.yaml

tasks:
  default: task --list

  lint:
    desc: Run every check CI runs
    cmds:
      - task: lint:yaml
      - task: lint:kubeconform
      - task: lint:comments
      - task: lint:cloudflared-ingress
      - task: docs:build

  lint:yaml:
    desc: yamllint over the tree
    cmd: yamllint --strict {{.KUBERNETES_DIR}} {{.TALOS_DIR}} {{.BOOTSTRAP_DIR}} .github

  lint:kubeconform:
    desc: Validate rendered manifests against Kubernetes schemas
    deps: [lint:schemas]
    cmd: bash {{.ROOT_DIR}}/scripts/kubeconform.sh {{.KUBERNETES_DIR}}
    preconditions:
      - sh: test -f {{.ROOT_DIR}}/scripts/kubeconform.sh
        msg: scripts/kubeconform.sh is missing

  # The public CRD catalog kubeconform falls back to lags upstream and rejects
  # unknown fields outright, so CRDs whose chart version this repo pins get their
  # schemas generated from that chart instead. Gitignored: regenerating is cheap
  # and a committed copy would drift from the pinned version.
  lint:schemas:
    desc: Generate kubeconform schemas from pinned chart CRDs
    cmd: bash {{.ROOT_DIR}}/scripts/crd-schemas.sh {{.ROOT_DIR}}/.schemas
    sources:
      - "{{.ROOT_DIR}}/scripts/crd-schemas.sh"
      - "{{.KUBERNETES_DIR}}/apps/volsync-system/volsync/app/helmrelease.yaml"
      - "{{.KUBERNETES_DIR}}/apps/cnpg-system/cnpg-operator/app/helmrelease.yaml"
    generates:
      - "{{.ROOT_DIR}}/.schemas/**/*.json"

  # Rule 2 in AGENTS.md gives a number, so something has to measure it.
  lint:comments:
    desc: Fail if comment lines exceed 10 percent of the tree
    cmd: bash {{.ROOT_DIR}}/scripts/comment-budget.sh

  lint:cloudflared-ingress:
    desc: Ensure tunnel routes cannot bypass the external Gateway
    cmd: bash {{.ROOT_DIR}}/scripts/check-cloudflared-ingress.sh

  diff:
    desc: Show what a change would actually do to the cluster
    cmd: >-
      flux-local diff ks --path {{.KUBERNETES_DIR}}/flux/cluster --all-namespaces
      --sources flux-system --branch-orig origin/main
