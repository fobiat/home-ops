---
# Builds and publishes the MkDocs site to GitHub Pages. The lint workflow
# already runs task docs:build on every PR; this is the deploy half, only on
# main once a docs change actually merges.
name: docs
on:
  push:
    branches: ["main"]
    paths: ["docs/**", "mkdocs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Build
        run: task docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Post result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          [[ -z "${WEBHOOK}" ]] && { echo "no webhook configured, skipping"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${RESULT}" == "success" ]]; then
            colour=3066993; status="passed"
          else
            colour=15158332; status="${RESULT}"
          fi
          payload=$(jq -n \
            --arg t "docs deploy ${status}" \
            --arg d "[\`${GITHUB_REF_NAME}\`](${RUN_URL}) on ${GITHUB_REPOSITORY}" \
            --argjson c "${colour}" \
            '{embeds: [{title: $t, description: $d, color: $c}]}')
          curl -sS -H "Content-Type: application/json" -d "${payload}" "${WEBHOOK}" >/dev/null
