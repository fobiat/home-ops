---
# Shows what a change would actually do to the cluster before it is merged.
# Borrowed from carpenike/k8s-gitops.
name: flux-diff
on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resource: ["helmrelease", "kustomization"]
    steps:
      # flux-local shells out to the flux CLI, which is not on the runner by default.
      - name: Install flux
        uses: fluxcd/flux2/action@v2.9.4

      # The action does its own checkout of both the PR and the live branch
      # (into pr/ and live/), then builds its working path as pr/<path>. Passing
      # an already-prefixed path here double-prefixes it.
      - name: Diff
        uses: allenporter/flux-local/action/diff@7.7.1
        id: diff
        with:
          sources: flux-system
          path: kubernetes/flux/cluster
          live-branch: main
          resource: ${{ matrix.resource }}
          # Default 10000 lets a chart that renders many resources (kube-prometheus-stack:
          # dozens of PrometheusRules, RBAC, etc.) sum to a diff so large the PR-comment
          # step's own process invocation fails with "Argument list too long". This caps
          # the worst case; the full diff is always available locally via `task diff`.
          limit-bytes: 1500

      - name: Comment on the PR
        if: steps.diff.outputs.diff != ''
        uses: mshick/add-pr-comment@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: "${{ github.event.pull_request.number }}/${{ matrix.resource }}"
          message-failure: Diff failed
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
