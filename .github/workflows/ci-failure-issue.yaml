---
# Opens an issue when a gate fails on main, so a broken main is tracked rather than
# noticed three weeks later. Reuses one issue per workflow instead of opening a new one
# on every failed run, and closes it when that gate goes green again.
#
# `sync-actions-runners` is the one that most needs this: it only runs on a weekly cron,
# so a failure there is invisible until someone thinks to open the Actions tab. `docs`
# publishes the Pages site from main and fails the same way, quietly. `flux-diff` is
# deliberately absent: it is pull_request-only, so its failures are already unmissable
# on the PR itself and would never produce a broken main to track.
name: ci-failure-issue
on:
  workflow_run:
    workflows: ["lint", "docs", "sync-actions-runners"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          export TITLE="CI failing on main: ${WORKFLOW}"
          # Matched exactly rather than through `--search ... in:title`. All three titles
          # share the "CI failing on main:" prefix, and search tokenises, so a fuzzy match
          # can rank another workflow's issue first and get it closed by this run.
          existing=$(gh issue list --repo "${REPO}" --state open --label ci-failure \
            --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')

          if [[ "${CONCLUSION}" == "success" ]]; then
            if [[ -n "${existing}" ]]; then
              gh issue close "${existing}" --repo "${REPO}" \
                --comment "Green again on \`${SHA:0:7}\`. Closing."
            fi
            exit 0
          fi

          body=$(printf '%s\n' \
            "\`${WORKFLOW}\` finished with \`${CONCLUSION}\` on \`main\`." \
            "" \
            "- Commit: \`${SHA}\`" \
            "- Run: ${RUN_URL}" \
            "" \
            "This issue closes itself when the gate next passes on main.")

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${REPO}" --body "${body}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" \
              --label ci-failure --label area/ci --body "${body}"
          fi
